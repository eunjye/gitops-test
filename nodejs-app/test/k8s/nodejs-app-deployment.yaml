apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: nodejs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
      - name: nodejs-app
        # Kustomize가 이 이미지 태그를 관리
        image: eunjye2/nodejs-app:latest
        ports:
        - containerPort: 3000
