apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-app
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer

spec:
  project: default
  source:
    repoURL: https://github.com/eunjye/gitops-test.git
    targetRevision: main
    path: springboot-app/hello/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
