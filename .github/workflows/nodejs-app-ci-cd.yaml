name: Nodejs CI/CD (Build, Push, Update Manifest)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'nodejs-app/test/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build --if-present
        working-directory: ./nodejs-app/test

      - name: Generate short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nodejs-app/test
          file: ./nodejs-app/test/Dockerfile
          push: true
          tags: |
            eunjye2/nodejs-app:${{ steps.vars.outputs.sha }}
            eunjye2/nodejs-app:latest

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update K8s manifest with new image tag
        run: kustomize edit set image eunjye2/nodejs-app=eunjye2/nodejs-app:${{ steps.vars.outputs.sha }}
        working-directory: ./nodejs-app/test/k8s

      - name: Commit and push manifest changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./nodejs-app/test/k8s/kustomization.yaml
          git commit -m "Update image tag for nodejs-app to ${{ steps.vars.outputs.sha }}"
          git push